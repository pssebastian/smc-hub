<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SMC Hub - Quick and easy access to congregation forms and links." />
  <meta name="theme-color" content="#2563eb" />
  <title>SMC Hub</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- Optional Announcement Banner -->
  <div id="announcementBanner" class="announcement-banner" role="alert"></div>

  <!-- Minimized Sticky Header -->
  <header class="site-header" id="siteHeader">
    <div class="container header-container">
      <!-- Main Bar: Title, Search (Desktop), and Actions -->
      <div class="header-main-bar">
        <!-- Site Title (Strictly 'SMC Hub', logo removed, compact) -->
        <a href="#" class="brand-link" id="brandLink">
          <h1 id="siteTitle" class="site-title">SMC Hub</h1>
        </a>

        <!-- Desktop Search Bar Container (In-line on Desktop) -->
        <div class="desktop-search-container desktop-only" id="desktopSearchContainer">
          <div class="search-box-wrapper" id="searchBoxWrapper">
            <span class="search-icon-left" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
              </svg>
            </span>
            <input
              type="search"
              id="searchInput"
              class="search-input"
              placeholder="Search forms... (Press '/' to focus)"
              autocomplete="off"
              aria-label="Search forms"
            />
            <button id="searchClearBtn" class="search-clear-btn" type="button" aria-label="Clear search input">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Header Actions: Search Toggle (Mobile), Filter Toggle, Theme Toggle -->
        <div class="header-actions">
          <!-- Mobile Search Toggle Button (Mobile only) -->
          <button id="mobileSearchToggleBtn" class="header-icon-btn mobile-only-btn" type="button" aria-label="Toggle search bar" aria-expanded="false" title="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </button>

          <!-- Filter Toggle Button (Desktop & Mobile) -->
          <button id="filterToggleBtn" class="header-icon-btn filter-toggle-btn" type="button" aria-label="Toggle category filters" aria-expanded="false" title="Filter forms">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.539.092 1.003.451 1.144.975.25.927.42 1.884.509 2.859a2.25 2.25 0 0 1-.58 1.638l-4.73 5.09a2.25 2.25 0 0 0-.616 1.545v3.424a2.25 2.25 0 0 1-.659 1.59l-2.072 2.072A.75.75 0 0 1 11.75 22.5v-7.69a2.25 2.25 0 0 0-.616-1.545L6.404 8.17a2.25 2.25 0 0 1-.58-1.638 31.848 31.848 0 0 1 .509-2.859 1.688 1.688 0 0 1 1.144-.975A47.16 47.16 0 0 1 12 3Z" />
            </svg>
            <span class="filter-btn-text desktop-only">Filters</span>
            <span id="filterActiveDot" class="filter-active-dot" aria-hidden="true"></span>
          </button>

          <!-- Light / Dark Theme Switcher Button -->
          <button id="themeToggleBtn" class="header-icon-btn theme-toggle-btn" type="button" aria-label="Toggle Light and Dark Mode" title="Toggle theme">
            <!-- Moon Icon (displayed in light mode) -->
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
            </svg>
            <!-- Sun Icon (displayed in dark mode) -->
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Expandable Mobile Search Drawer (Exact same smooth scheme as Filter Drawer) -->
      <div id="mobileSearchDrawer" class="search-drawer" aria-hidden="true">
        <!-- Search box is positioned here on mobile <= 640px -->
      </div>

      <!-- Expandable Filter Drawer (Displays form types below header when filter icon is toggled) -->
      <div id="filterDrawer" class="filter-drawer" aria-hidden="true">
        <nav id="categoriesFilterBar" class="categories-filter-bar" aria-label="Filter by category">
          <!-- Dynamically generated category chips -->
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content: Forms Directory Grid -->
  <main class="main-content">
    <div class="container">
      <!-- Status row (Active Category & Form count only) -->
      <div class="directory-status-row">
        <span id="activeCategoryLabel" class="active-filter-indicator">All Categories</span>
        <span id="statusCount" class="status-count">Showing forms...</span>
      </div>

      <!-- Forms Grid (Default: 2-column mobile grid, 3-4 column desktop grid) -->
      <div id="formsGrid" class="forms-grid" role="region" aria-live="polite">
        <!-- Dynamically generated cards -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" role="status">
        <div class="empty-state-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </div>
        <h2 class="empty-state-title">No matching forms found</h2>
        <p class="empty-state-text">We couldn't find any forms matching your search or active filter. Try using different keywords or reset your filters.</p>
        <button id="resetFiltersBtn" class="reset-filters-btn" type="button">
          Reset all filters
        </button>
      </div>
    </div>
  </main>

  <!-- Floating Back to Top Button (Mobile & Desktop, appears on scroll) -->
  <button id="floatingBackToTopBtn" class="floating-back-to-top-btn" type="button" aria-label="Back to top" title="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
    </svg>
  </button>

  <!-- Minimal Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <p>&copy; <span id="currentYear">2026</span> SMC Hub. Links open securely in a new tab.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="./js/forms-data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
