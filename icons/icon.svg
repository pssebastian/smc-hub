<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- 4-Square Hub Tiles -->
  <g transform="translate(85, 75)">
    <!-- Tile 1 (top-left, white) -->
    <rect x="0" y="0" width="144" height="144" rx="40" fill="#ffffff"/>
    <line x1="40" y1="52" x2="104" y2="52" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
    <line x1="40" y1="74" x2="104" y2="74" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
    <line x1="40" y1="96" x2="80" y2="96" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>

    <!-- Tile 2 (top-right, sky blue) -->
    <rect x="198" y="0" width="144" height="144" rx="40" fill="#93c5fd"/>
    <circle cx="270" cy="72" r="30" fill="none" stroke="#1e3a8a" stroke-width="8"/>
    <circle cx="270" cy="72" r="10" fill="#1e3a8a"/>

    <!-- Tile 3 (bottom-left, sky blue) -->
    <rect x="0" y="198" width="144" height="144" rx="40" fill="#93c5fd"/>
    <path d="M40 270 L64 294 L104 246" fill="none" stroke="#1e3a8a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tile 4 (bottom-right, white) -->
    <rect x="198" y="198" width="144" height="144" rx="40" fill="#ffffff"/>
    <path d="M238 270 L262 294 L302 246" fill="none" stroke="#16a34a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SMC Typography -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-weight="900" font-size="74" fill="#ffffff" letter-spacing="4">SMC</text>
</svg>
